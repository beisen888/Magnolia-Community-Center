<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Magnolia DSP Schedule</title>
  <meta name="description" content="Magnolia Community Services staff scheduling: activity teams, 4-hour shifts, weekly hours.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1F4D3D">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="var(--accent)" stroke-width="2"><path d="M20 33C13 27 12 17 20 7c8 10 7 20 0 26Z" fill="color-mix(in srgb,var(--t1) 30%,transparent)"/><path d="M19 33C10 32 5 24 6 15c8 2 13 9 13 18Z"/><path d="M21 33c9-1 14-9 13-18-8 2-13 9-13 18Z"/></g></svg>
    <div><div class="eyebrow" id="org">Magnolia Community Services</div><h1 id="app">DSP Schedule</h1></div>
  </div>
  <div class="who" id="who"></div>
  <button class="iconbtn" id="theme" aria-label="Switch light or dark mode" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
</div>
<nav class="tabs wrap" id="tabs" role="tablist"></nav>
</header>

<main class="wrap">
  <div id="notice"></div>
  <section id="view"></section>
</main>
<footer class="footer wrap" id="footer"></footer>

<dialog id="signin">
  <form id="signin-form" method="dialog">
    <h2>Sign in</h2>
    <p>Enter your work or personal email and we'll send a one-tap sign-in link. No password.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <div class="row">
      <button type="button" class="btn quiet lg" id="signin-cancel">Cancel</button>
      <button type="submit" class="btn lg" id="signin-send">Send link</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
