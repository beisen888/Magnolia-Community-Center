<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Magnolia DSP Schedule</title>
  <meta name="description" content="Magnolia Community Services staff scheduling: activity teams, 4-hour shifts, weekly hours.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#29572D">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alice&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="wrap topbar">
  <a class="brand" href="#home" aria-label="Magnolia DSP Schedule home">
    <svg viewBox="0 0 40 44" aria-hidden="true"><path d="M19 26v14M19 31l-5-4M19 29l5-4" stroke="#6B4A2E" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle cx="19" cy="15" r="13" fill="#497A39"/><circle cx="12" cy="11" r="4.2" fill="#29572D"/><circle cx="25" cy="18" r="4.6" fill="#29572D"/><circle cx="21" cy="8" r="3.6" fill="#5E9147"/><path d="M14 19c2-3 5-3 7 0-2 2.6-5 2.6-7 0Z" fill="#F3EDD6"/><circle cx="17.5" cy="19" r="1.4" fill="#DEA710"/></svg>
    <span class="wordmark"><span class="wm">Magnolia</span><span class="sub">Community Services · DSP Schedule</span></span>
  </a>
  <div class="who" id="who"></div>
  <button class="iconbtn" id="theme" aria-label="Switch light or dark mode" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
</div>
<nav class="navbar"><div class="tabs wrap" id="tabs" role="tablist"></div></nav>
</header>

<main class="wrap">
  <div id="notice"></div>
  <section id="view"></section>
</main>
<footer class="footer wrap" id="footer"></footer>

<dialog id="signin">
  <form id="signin-form" method="dialog">
    <h2>Sign in</h2>
    <p>Enter your work or personal email and we'll send a one-tap sign-in link. No password.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <div class="row">
      <button type="button" class="btn quiet lg" id="signin-cancel">Cancel</button>
      <button type="submit" class="btn lg" id="signin-send">Send link</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
